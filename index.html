<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex,nofollow">
  <title>Tool</title>
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
    main{min-height:100vh;min-height:100dvh;padding:clamp(20px,6vw,72px);display:flex;align-items:center;justify-content:center}
    nav{width:min(100%,1000px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2vw,24px)}
    a{height:clamp(215px,36vw,400px);border:1px solid #666;color:#fff;text-decoration:none;padding:clamp(22px,4vw,42px);display:flex;align-items:flex-end;justify-content:space-between;gap:12px;transition:background .2s,color .2s,border-color .2s}
    a span{font-size:clamp(28px,5vw,64px);font-weight:700;letter-spacing:-.055em;line-height:1}
    a svg{width:clamp(26px,3vw,38px);height:auto;flex:none;stroke:currentColor;stroke-width:1.6;fill:none}
    a:hover,a:focus-visible{background:#fff;border-color:#fff;color:#000;outline:none}
    @media(max-width:650px){nav{grid-template-columns:1fr}a{height:clamp(180px,32dvh,295px)}a span{font-size:clamp(34px,9vw,52px)}}
    @media(prefers-reduced-motion:reduce){a{transition:none}}
  </style>

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
  <main><nav aria-label="Seleziona strumento">
    <a href="./confronto.html"><span>Confronto</span><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 16h24M17 5l11 11-11 11"/></svg></a>
    <a href="./calcolatore.html"><span>Calcolatore</span><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 16h24M17 5l11 11-11 11"/></svg></a>
  </nav></main>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
